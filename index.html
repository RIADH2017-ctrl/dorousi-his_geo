<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التاريخ والجغرافيا</title>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 12px; background: #2980b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .request-link { margin-top: 15px; display: block; color: #e74c3c; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card" id="login-screen">
        <h2>منصة التاريخ والجغرافيا</h2>
        <p>الرجاء إدخال الرمز السري للولوج</p>
        <input type="password" id="passcode" placeholder="أدخل الرمز السري...">
        <button onclick="checkPassword()">دخول</button>
        <a class="request-link" href="mailto:slimir334@gmail.com?subject=طلب الرمز السري&body=السلام عليكم أستاذ، أريد طلب الرمز السري. الاسم واللقب:">
            طلب الرمز السري عبر البريد
        </a>
    </div>

    <script>
        function checkPassword() {
            if (document.getElementById('passcode').value === "a2017mrr") {
                window.location.href = "resources.html";
            } else {
                alert('الرمز السري غير صحيح.');
            }
        }
    </script>
</body>
</html>
